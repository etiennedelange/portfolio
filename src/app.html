<!doctype html>

<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="Etienne de Lange – Software Engineer III with 14+ years of experience in .NET, Azure, Angular, and full-stack development." />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
		<script>
			(function () {
				var t = localStorage.getItem('theme');
				var dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');

				// Apply time-of-day palette before first paint (mirrors timeTheme.ts)
				var h = new Date().getHours() + new Date().getMinutes() / 60;
				var A = [
					[0,  ['#f0f0ff','#e8e8f8','#f0f0ff','#6366f1','#7c7c9a','#d0d0e8'],['#070d1a','#0d1428','#0a1120','#818cf8','#6b7a9a','#1a2540']],
					[5,  ['#fff7ed','#fff0dc','#fff7ed','#f97316','#78716c','#fed7aa'],['#1c1008','#241509','#201208','#f97316','#9a7858','#3d2010']],
					[7,  ['#ffffff','#f5f5f4','#ffffff','#f5d90a','#6b7280','#e5e7eb'],['#1c160e','#241b11','#2a1e12','#f5d90a','#a89178','#3d2d1a']],
					[11, ['#f0f9ff','#e0f2fe','#f0f9ff','#0ea5e9','#4b6a7a','#bae6fd'],['#071525','#0a1c30','#091a2e','#38bdf8','#6a8aaa','#1a3a55']],
					[16, ['#fffbeb','#fef3c7','#fffbeb','#f59e0b','#78716c','#fde68a'],['#1c1208','#241909','#201508','#fbbf24','#a89060','#3d2810']],
					[19, ['#f0eaff','#e6ddff','#f0eaff','#7c3aed','#6a5a9e','#d0c4ff'],['#0e0a20','#150f2e','#120d28','#a78bfa','#8080c0','#251e48']],
					[24, ['#f0f0ff','#e8e8f8','#f0f0ff','#6366f1','#7c7c9a','#d0d0e8'],['#070d1a','#0d1428','#0a1120','#818cf8','#6b7a9a','#1a2540']],
				];
				var K = ['--c-bg','--c-bg-alt','--c-bg-card','--c-accent','--c-muted','--c-border-soft'];
				function lx(a, b, t) {
					var pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
					return '#' + [[(pa>>16)&255,(pb>>16)&255],[(pa>>8)&255,(pb>>8)&255],[pa&255,pb&255]]
						.map(function(c){return Math.round(c[0]+(c[1]-c[0])*t).toString(16).padStart(2,'0');}).join('');
				}
				var from = A[0], to = A[A.length-1];
				for (var i = 0; i < A.length-1; i++) {
					if (h >= A[i][0] && h < A[i+1][0]) { from = A[i]; to = A[i+1]; break; }
				}
				var span = to[0]-from[0], tt = span > 0 ? (h-from[0])/span : 0;
				var fp = dark ? from[2] : from[1], tp = dark ? to[2] : to[1];
				K.forEach(function(k,i){ document.documentElement.style.setProperty(k, lx(fp[i],tp[i],tt)); });
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
