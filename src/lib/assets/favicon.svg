<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<title>Etienne.</title>
	<style>
		.edge { fill: #0a0a0a; }
		.tile { fill: #0a0a0a; }
		.mark { fill: #f0e8d8; }
		@media (prefers-color-scheme: dark) {
			.edge { fill: #f0e8d8; }
			.tile { fill: #1c160e; }
		}
	</style>
	<!-- tile (edge shows as a cream border on dark tab bars) -->
	<rect class="edge" x="2" y="2" width="60" height="60" rx="10" />
	<rect class="tile" x="5" y="5" width="54" height="54" rx="7" />
	<!-- E. -->
	<g class="mark">
		<rect x="16" y="16" width="8" height="32" />
		<rect x="16" y="16" width="24" height="7" />
		<rect x="16" y="28.5" width="20" height="7" />
		<rect x="16" y="41" width="24" height="7" />
		<rect x="42" y="41" width="7" height="7" />
	</g>
</svg>
